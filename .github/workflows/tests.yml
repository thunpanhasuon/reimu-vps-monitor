name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  ubuntu-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu update-monitor dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-apt iproute2 unattended-upgrades
      - name: Verify security-only policy and real unattended-upgrade dry run
        run: sudo /usr/bin/python3 tests/updates_integration.py
        timeout-minutes: 10
      - name: Check APT cache and listening sockets in service sandbox
        run: |
          sudo install -d /opt/reimu-ci
          sudo install -m 644 security_checks.py tests/linux_integration.py /opt/reimu-ci/
          sudo systemd-run --unit=reimu-ci --wait --pipe --collect --property=User=runner --property=ProtectSystem=strict --property=ProtectHome=true --property=PrivateTmp=true --property=NoNewPrivileges=true --property=CapabilityBoundingSet= /usr/bin/python3 /opt/reimu-ci/linux_integration.py
        timeout-minutes: 20
